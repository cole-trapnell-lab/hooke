name: ci-v2
# Builds the site from gh-pages-src-v2 and publishes it to the root of the
# gh-pages branch (https://cole-trapnell-lab.github.io/hooke/). This branch is
# the source of the published documentation; gh-pages-src is retired.
on:
  push:
    branches:
      - gh-pages-src-v2
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v3
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force
